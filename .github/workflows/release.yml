# Publishes a GitHub release whenever macclean/__version__ changes on the
# default branch (and no release exists for that version yet). Installed
# copies of the app see it within a few hours, or right away via
# Mac Cleaner -> Check for Updates. Can also be run by hand from the Actions tab.
name: Release
on:
  push:
    paths: ["macclean/__init__.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  plan:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(python -c 'import macclean; print(macclean.__version__)')"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "Release v$v already exists; nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Tests
        if: steps.v.outputs.exists != 'true'
        run: python -m unittest discover -s tests

  app:
    needs: plan
    if: needs.plan.outputs.exists != 'true'
    uses: ./.github/workflows/build-app.yml
    with:
      release: true
    secrets:
      MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}

  publish:
    needs: [plan, app]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: mac-app
          path: dist
      - name: Build
        run: |
          rm -f dist/screenshot.png
          python scripts/build_release.py dist
          cat dist/SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.plan.outputs.version }}"
          gh release create "v$v" dist/mac-cleaner-*.tar.gz dist/Mac-Cleaner-*.zip dist/Mac-Cleaner-*.dmg \
            dist/SHA256SUMS dist/install.sh \
            --target "$GITHUB_SHA" --title "Mac Cleaner $v" --notes-file dist/notes.md
