# Builds Mac Cleaner.app on a macOS machine, launches it to make sure it
# starts, and uploads the .zip (updates), .dmg (first install) and a screenshot.
# Used by the Release workflow; also runs on its own when the app shell changes.
name: Build Mac app
on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    secrets:
      MACOS_SIGNING_P12_BASE64:
        required: false
  workflow_dispatch:
  push:
    paths: ["macos/**", ".github/workflows/build-app.yml"]
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Python runtimes (Apple Silicon + Intel)
        run: |
          uv python install cpython-3.12.13-macos-aarch64-none cpython-3.12.13-macos-x86_64-none \
            --install-dir "$RUNNER_TEMP/py"
          ls "$RUNNER_TEMP/py"
      - name: Build
        env:
          MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
        run: |
          python3 macos/build_app.py --out build ${{ inputs.release && '--require-identity' || '' }} \
            --arm "$RUNNER_TEMP/py/cpython-3.12.13-macos-aarch64-none" \
            --x86 "$RUNNER_TEMP/py/cpython-3.12.13-macos-x86_64-none"
          du -sh "build/Mac Cleaner.app" build/*.zip build/*.dmg
          lipo -info "build/Mac Cleaner.app/Contents/MacOS/MacCleaner" "build/Mac Cleaner.app/Contents/Resources/python/bin/python3.12"
          codesign -dvv "build/Mac Cleaner.app" 2>&1 | grep -E "Identifier|Authority|Signature|TeamIdentifier"
          codesign -dr - "build/Mac Cleaner.app" 2>&1 | tail -1
          # The updater's own signature check must accept this build (it will for releases).
          PYTHONPATH=. python3 -c "import sys; from pathlib import Path; import macclean.updater as u; ok = u.signed_by_us(Path('build/Mac Cleaner.app')); print('signed with the release key:', ok); sys.exit(0 if ok or '${{ inputs.release }}' != 'true' else 1)"
      - name: Launch it
        run: |
          APP="build/Mac Cleaner.app"
          LOG="$HOME/Library/Logs/Mac Cleaner.log"
          MACCLEAN_VERBOSE=1 "$APP/Contents/MacOS/MacCleaner" &
          PID=$!
          for i in $(seq 1 90); do grep -q "GET /api/overview" "$LOG" 2>/dev/null && break; sleep 1; done
          cat "$LOG"
          URL="$(grep -o 'http://127.0.0.1:[0-9]*/' "$LOG" | tail -1)"
          curl -fsS "${URL}api/status" | head -c 300; echo
          curl -fsS "${URL}" | grep -q "Mac Cleaner"
          sleep 4
          screencapture -x build/screenshot.png || echo "no screenshot"
          # The window really showed the dashboard: its page, script and data calls hit the engine.
          for path in "GET / " "GET /static/app.js" "GET /api/status" "GET /api/overview"; do
            grep -q "\"$path" "$LOG" || { echo "::error::the window never requested $path"; exit 1; }
          done
          echo "window loaded the dashboard"
          kill "$PID"
          sleep 3
          if pgrep -f "Mac Cleaner.app/Contents/Resources/python" >/dev/null; then
            echo "::error::the engine kept running after the app was killed"; exit 1
          fi
          arch -x86_64 "$APP/Contents/Resources/python/bin/python3" -c "import platform, sqlite3; print('intel engine ok', platform.machine())" \
            || echo "Rosetta not available on this runner; skipped the Intel check"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-app
          path: |
            build/*.zip
            build/*.dmg
            build/screenshot.png
          if-no-files-found: error
